services:
  sync:
    image: node:20-alpine
    container_name: libretro-sync
    working_dir: /app
    command: ["node", "sync-server.js"]
    environment:
      - SYNC_DATA_DIR=/data
      - SYNC_PORT=8787
    volumes:
      - ".:/app:ro"
      - "./sync-data:/data"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: libretro-nginx
    ports:
      - "8080:80"
    volumes:
      - "./libretro:/usr/share/nginx/html:ro"
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      - sync
    restart: unless-stopped

